<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digi-Switchride Rider App</title>
  <style>
    :root { --brand:#5B7CFA; --brand2:#2E90FA; --ink:#16192A; --muted:#667085; --bg:#F4F6FB; --card:#fff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, Segoe UI, system-ui, sans-serif; background:#0f1220; color:var(--ink); }
    .phone { width:390px; min-height:844px; margin:0 auto; background:var(--bg); position:relative; overflow:hidden; }
    .status { height:28px; background:transparent; }
    .screen { padding:16px 16px 88px; }
    h1 { font-size:26px; margin:0 0 12px; }
    h2 { font-size:16px; margin:16px 0 8px; }
    p { margin:0; }
    .muted { color:var(--muted); font-size:13px; }
    .row { display:flex; gap:8px; }
    .card { background:var(--card); border-radius:16px; padding:14px; box-shadow:0 8px 24px rgba(22,25,43,.08); margin-bottom:10px; }
    .stat { flex:1; }
    .stat strong { display:block; font-size:20px; }
    .hero { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--brand2)); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:28px; }
    .btn { width:100%; border:0; border-radius:14px; padding:14px; background:var(--brand); color:#fff; font-weight:600; font-size:15px; }
    .btn.ghost { background:#fff; color:var(--brand); border:1px solid #d9def2; }
    input, select { width:100%; padding:12px; border-radius:12px; border:1px solid #d8dce8; margin:8px 0; font-size:14px; }
    .chip { display:inline-block; background:#EEF1FF; color:var(--brand); border-radius:20px; padding:4px 10px; font-size:12px; font-weight:600; }
    .nav { position:absolute; bottom:0; left:0; right:0; height:72px; background:#fff; display:flex; border-top:1px solid #eceef5; }
    .nav a { flex:1; text-align:center; text-decoration:none; color:#8b93ab; font-size:11px; padding-top:10px; }
    .nav a.on { color:var(--brand); font-weight:700; }
    .nav span { display:block; font-size:18px; }
    .login-hero { padding:32px 24px 16px; text-align:center; }
    .list { display:flex; justify-content:space-between; align-items:center; }
    .ok { color:#12B76A; font-weight:600; font-size:12px; }
    .warn { color:#F79009; font-weight:600; font-size:12px; }
  </style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
const screens = {
  login: `<div class="login-hero">
    <div class="hero">⚡</div>
    <h1>Digi-Switchride</h1>
    <p class="muted">Your vehicle, plan, payments and support</p>
  </div>
  <div class="screen">
    <div class="card">
      <h2>Sign in</h2>
      <input value="priya.rider" />
      <input type="password" value="••••••••" />
      <input value="acme-fleet" />
      <p class="muted" style="margin-bottom:12px">Organization slug</p>
      <button class="btn">Sign in</button>
    </div>
  </div>`,
  home: `<div class="screen">
    <h1>Hello Priya</h1>
    <div class="row">
      <div class="card stat"><p class="muted">Wallet</p><strong>₹1,250</strong></div>
      <div class="card stat"><p class="muted">Due</p><strong>₹0</strong></div>
    </div>
    <div class="card"><p class="muted">Rental plan</p><strong>Monthly City</strong><p class="muted">₹4,000 · Monthly</p></div>
    <div class="card"><p class="muted">Vehicle</p><strong>KA01AB1234</strong><p class="muted">Ather 450X · Available · 86%</p></div>
    <div class="card" style="background:#EEF1FF"><strong>KYC Approved</strong><p class="muted">Documents verified</p></div>
  </div>
  <div class="nav">
    <a class="on"><span>⌂</span>Home</a><a><span>🛵</span>Vehicle</a><a><span>₹</span>Pay</a><a><span>☰</span>Plan</a><a><span>▦</span>More</a>
  </div>`,
  vehicle: `<div class="screen">
    <div class="card list"><div><strong>KA01AB1234</strong><p class="muted">Ather 450X · Two Wheeler · battery 86%</p></div><span class="chip">Available</span></div>
    <h2>Report breakdown</h2>
    <input value="Battery" />
    <input placeholder="What happened?" />
    <button class="btn">Send to Command Center</button>
    <h2>Service request</h2>
    <input value="General service" />
    <button class="btn ghost">Raise request</button>
  </div>
  <div class="nav">
    <a><span>⌂</span>Home</a><a class="on"><span>🛵</span>Vehicle</a><a><span>₹</span>Pay</a><a><span>☰</span>Plan</a><a><span>▦</span>More</a>
  </div>`,
  pay: `<div class="screen">
    <div class="card"><p class="muted">Outstanding</p><strong>₹0</strong><p class="muted">0 dues</p></div>
    <div class="card"><p class="muted">Wallet</p><strong>₹1,250</strong></div>
    <h2>Pay now</h2>
    <button class="btn ghost">Wallet</button><div style="height:8px"></div>
    <button class="btn">UPI</button><div style="height:8px"></div>
    <button class="btn ghost">QR · NetBanking · Cards</button>
    <h2>Payment history</h2>
    <div class="card list"><div><strong>₹4,000</strong><p class="muted">UPI</p></div><span class="ok">Paid</span></div>
  </div>
  <div class="nav">
    <a><span>⌂</span>Home</a><a><span>🛵</span>Vehicle</a><a class="on"><span>₹</span>Pay</a><a><span>☰</span>Plan</a><a><span>▦</span>More</a>
  </div>`,
  book: `<div class="screen">
    <h1>Book a ride</h1>
    <div class="card"><strong>Koramangala Hub</strong><p class="muted">1.2 km away</p><span class="chip">8 free</span></div>
    <div class="card"><strong>Indiranagar Hub</strong><p class="muted">3.4 km away</p><span class="chip">5 free</span></div>
    <div class="card list"><div><strong>KA01AB1234</strong><p class="muted">EScooter · 86%</p></div><button class="btn" style="width:auto;padding:8px 12px">Book & Ride</button></div>
  </div>
  <div class="nav">
    <a><span>⌂</span>Home</a><a><span>🛵</span>Vehicle</a><a><span>₹</span>Pay</a><a><span>☰</span>Plan</a><a class="on"><span>▦</span>More</a>
  </div>`,
  more: `<div class="screen">
    <h1>More</h1>
    ${['My profile','Agreements & KYC','Book a ride (nearby hubs)','Charging stations','Help & support','Feedback & rating','Refer & earn'].map(t=>`<div class="card list"><strong>${t}</strong><span class="muted">›</span></div>`).join('')}
  </div>
  <div class="nav">
    <a><span>⌂</span>Home</a><a><span>🛵</span>Vehicle</a><a><span>₹</span>Pay</a><a><span>☰</span>Plan</a><a class="on"><span>▦</span>More</a>
  </div>`
};
const key = new URLSearchParams(location.search).get('s') || 'login';
document.getElementById('app').innerHTML = screens[key] || screens.login;
</script>
</body>
</html>
