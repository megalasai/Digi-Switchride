# POC stack — one DigitalOcean droplet.
# From repository root:
#   docker compose -f infra/digitalocean/docker-compose.poc.yml --env-file infra/digitalocean/.env.poc up -d --build
name: switchride-poc

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.poc
    environment:
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/switchride
      LOCATION_API_URL: http://location:4100
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"

  admin:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_PROXY_TARGET: http://api:4000
      NEXT_PUBLIC_API_URL: /api-proxy/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  location:
    build:
      context: ../..
      dockerfile: apps/location/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4100"
      HOST: 0.0.0.0
      LOCATION_DB: /data/india.sqlite
      LOCATION_WORKERS: "1"
      LOCATION_API_KEYS: ${LOCATION_API_KEYS:-}
      LOCATION_CORS_ORIGIN: "*"
    volumes:
      - location_data:/data
    ports:
      - "4100:4100"

  telemetry:
    build:
      context: ../..
      dockerfile: apps/telemetry/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.poc
    environment:
      TELEMETRY_HTTP_HOST: 0.0.0.0
      TELEMETRY_HTTP_PORT: "4200"
      TELEMETRY_TCP_HOST: 0.0.0.0
      TELEMETRY_TCP_PORT: "4210"
      WANWAY_TCP_ENABLED: "true"
      WANWAY_TCP_HOST: 0.0.0.0
      WANWAY_TCP_PORTS: "21100,5001,8821"
      TELEMETRY_SQLITE: /data/telemetry.sqlite
      MONGODB_URI: mongodb://mongo:27017/switchride
      LOCATION_API_URL: http://location:4100
      PLATFORM_API_URL: http://api:4000
      PLATFORM_TELEMETRY_PATH: /api/v1/internal/iot/telemetry
    volumes:
      - telemetry_data:/data
    depends_on:
      mongo:
        condition: service_healthy
      location:
        condition: service_started
    ports:
      - "4200:4200"
      - "4210:4210"
      - "21100:21100"
      - "5001:5001"
      - "8821:8821"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      POC_DOMAIN: ${POC_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin
      - api
      - location
      - telemetry

volumes:
  mongo_data:
  location_data:
  telemetry_data:
  caddy_data:
  caddy_config:
