services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: switchride
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  location:
    profiles: ["location"]
    build:
      context: .
      dockerfile: apps/location/Dockerfile
    ports:
      - "4100:4100"
    environment:
      PORT: "4100"
      HOST: "0.0.0.0"
      LOCATION_DB: /data/india.sqlite
      LOCATION_API_KEYS: ${LOCATION_API_KEYS:-}
    volumes:
      - location_data:/data

volumes:
  mongo_data:
  redis_data:
  location_data:
