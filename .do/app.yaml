# DigitalOcean App Platform — one HTTP port per web service.
# Import this spec (Apps → Create → App Spec) or add three Dockerfile
# components. Do not put admin + API on one component.
# Do not add a Functions component (`packages/` is not Functions).

name: digi-switchride
region: blr
features:
  - buildpack-stack=ubuntu-22

# One public hostname: each path prefix can belong to only one component.
# Without this, App Platform assigns "/" to every web service and validation fails.
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /geo
      component:
        name: location
        rewrite: /
    - match:
        path:
          prefix: /
      component:
        name: admin

services:
  - name: api
    dockerfile_path: apps/api/Dockerfile
    github:
      repo: megalasai/Digi-Switchride
      branch: cursor/nestjs-mongodb-platform-scaffold
      deploy_on_push: true
    http_port: 4000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 40
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Use the Public network SRV URI until this app is attached to the DB VPC.
      # private-db-… hostnames do not resolve on App Platform (ENOTFOUND).
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: Sw1tchR1de-Jwt-2026-Blr-7f3a9c2e4b8d1a6f
      - key: PASSWORD_SALT
        scope: RUN_TIME
        type: SECRET
        value: Sw1tchR1de-Salt-2026-Blr-c4e8
      - key: ADMIN_EMAIL
        scope: RUN_TIME
        value: admin@digiswitchride.com
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: Admin@123
      - key: CORS_ORIGIN
        scope: RUN_TIME
        value: "*"
      - key: LOCATION_SERVICE_URL
        scope: RUN_TIME
        value: http://location:4100
      - key: LOCATION_API_URL
        scope: RUN_TIME
        value: http://location:4100

  - name: admin
    dockerfile_path: apps/admin-web/Dockerfile
    github:
      repo: megalasai/Digi-Switchride
      branch: cursor/nestjs-mongodb-platform-scaffold
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /login
      initial_delay_seconds: 30
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: API_PROXY_TARGET
        value: http://api:4000
      - key: NEXT_PUBLIC_API_URL
        value: /api-proxy/v1

  - name: location
    dockerfile_path: apps/location/Dockerfile
    github:
      repo: megalasai/Digi-Switchride
      branch: cursor/nestjs-mongodb-platform-scaffold
      deploy_on_push: true
    http_port: 4100
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 180
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4100"
      - key: HOST
        value: "0.0.0.0"
      - key: LOCATION_WORKERS
        value: "1"
      - key: LOCATION_DB
        value: /tmp/india.sqlite
      - key: LOCATION_CORS_ORIGIN
        value: "*"
